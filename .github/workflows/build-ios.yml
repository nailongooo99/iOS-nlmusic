name: Build Nailong Music iOS 1.0
on:
  push:
    branches: [main, master]
    tags: ['ios-v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      signing:
        description: "unsigned: compile only; ad-hoc/development: registered devices"
        required: true
        type: choice
        default: unsigned
        options:
          - unsigned
          - ad-hoc
          - development

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.nailong.music.ios' }}
      BUILD_NUMBER: ${{ github.run_number }}
      SIGN_MODE: ${{ inputs.signing || 'unsigned' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select stable Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          XCODE=$(python3 - <<'PY'
          import pathlib, re
          apps=[]
          for p in pathlib.Path('/Applications').glob('Xcode_27*.app'):
              m=re.fullmatch(r'Xcode_(27(?:\.\d+){0,2})\.app',p.name)
              if m:
                  apps.append((tuple(map(int,m.group(1).split('.'))),str(p)))
          if apps:
              print(max(apps)[1])
          PY
          )
          if [[ -n "$XCODE" ]]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 27([. ]|$)'
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -list -project NailongMusic.xcodeproj
      - name: Run portable core tests
        run: bash scripts/test-core.sh
      - name: Build iOS Simulator (native SDK typecheck)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nailong-build-logs"
          xcodebuild -quiet -project NailongMusic.xcodeproj -scheme NailongMusic \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/nailong-sim" CODE_SIGNING_ALLOWED=NO \
            "PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID" build 2>&1 | tee "$RUNNER_TEMP/nailong-build-logs/simulator.log"
      - name: Install signing assets (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.signing != 'unsigned'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/install-signing.sh
      - name: Build and package IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nailong-build-logs"
          if [[ "$SIGN_MODE" == unsigned ]]; then
            bash scripts/build-ipa.sh "$SIGN_MODE" 2>&1 | tee "$RUNNER_TEMP/nailong-build-logs/device-unsigned.log"
          else
            # Keep signing-related build output out of downloadable log artifacts.
            bash scripts/build-ipa.sh "$SIGN_MODE"
          fi
      - name: Upload IPA and checksum
        uses: actions/upload-artifact@v4
        with:
          name: NailongMusic-iOS-1.0-${{ env.SIGN_MODE }}-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Summarize compiler diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/nailong-build-logs"
          shopt -s nullglob
          {
            echo "## Build diagnostics"
            echo '```text'
            for f in "$log_dir"/*.log; do
              echo "=== $(basename "$f") ==="
              grep -nEi '(^|[[:space:]])(fatal )?error:|\*\* (BUILD|ARCHIVE|EXPORT) FAILED \*\*' "$f" | head -n 100 || true
            done
            echo '```'
            echo "If no diagnostics appear, open the first failed step for details."
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NailongMusic-iOS-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nailong-build-logs/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/nailong-signing.keychain-db" 2>/dev/null || true
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/nailong-cert.p12" "$RUNNER_TEMP/nailong-profile.mobileprovision" "$RUNNER_TEMP/nailong-profile.plist"
